modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/davidjjung/nestegg/issues"
license = "MIT License"

[[mixins]]
config = "nest_egg.mixins.json"

[[mods]]
modId = "nest_egg"
version = "${mod_version}"
logoFile = "logo.png"
itemIcon = "minecraft:dirt"
